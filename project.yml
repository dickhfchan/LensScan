name: LensScan
options:
  bundleIdPrefix: com.viberobotic
  deploymentTarget:
    iOS: "17.0"
targets:
  LensScan:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.viberobotic.nativescan
        PRODUCT_NAME: NativeScan
        INFOPLIST_KEY_CFBundleDisplayName: NativeScan
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "NativeScan uses the camera to scan documents."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "NativeScan saves scanned pages to your photo library."
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
